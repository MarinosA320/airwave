# Builds the Airwave X-Plane plugin for Windows, macOS and Linux on every push.
# Download the result from the run's "Artifacts" section.
name: X-Plane plugin

on:
  push:
    paths: ['xplane-plugin/**', '.github/workflows/xplane-plugin.yml']
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-2022
            arch: win_x64
          - os: macos-14
            arch: mac_x64
          - os: ubuntu-22.04
            arch: lin_x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Get XPMP2
        shell: bash
        run: git clone --depth 1 --branch v3.7.0 https://github.com/TwinFan/XPMP2 xplane-plugin/lib/XPMP2
      - name: Configure
        shell: bash
        run: cmake -S xplane-plugin -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        shell: bash
        run: cmake --build build --config Release
      - name: Package
        shell: bash
        run: |
          mkdir -p out/Airwave/${{ matrix.arch }} out/Airwave/Resources/CSL
          cp build/${{ matrix.arch }}/Airwave.xpl out/Airwave/${{ matrix.arch }}/
          cp -R xplane-plugin/lib/XPMP2/Resources/* out/Airwave/Resources/
          cp xplane-plugin/CSL-README.txt out/Airwave/Resources/CSL/README.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Airwave-xplane-${{ matrix.arch }}
          path: out
