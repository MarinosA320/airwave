# Downloads taxiways, stands, gates, aprons and holding points for every airport on the Greek map
# from OpenStreetMap, and commits them to data/layouts. Run it from the Actions tab ("Run workflow").
# It also runs on the 1st of each month to pick up OpenStreetMap improvements.
name: Airport layouts

on:
  workflow_dispatch:
    inputs:
      airports:
        description: "ICAO codes separated by spaces (leave empty for all airports)"
        required: false
        default: ""
  schedule:
    - cron: "17 4 1 * *"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download layouts from OpenStreetMap
        run: node tools/fetch-layouts.js ${{ github.event.inputs.airports }}
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898499+github-actions[bot]@users.noreply.github.com"
          git add data/layouts
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update airport layouts from OpenStreetMap"
          git pull --rebase origin main
          git push
