# Runs every Airwave test on each push. Render waits for this to pass before deploying (autoDeployTrigger: checksPass).
name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: airwave_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: |
          node tools/test-procedures.js
          node tools/test-layouts.js
          node tools/test-passwords.js
          node tools/test-clearances.js
          node tools/test-editor.js
          node tools/test-panel.js
          node tools/test-ground.js
      - name: Member accounts (memory, then Postgres)
        run: |
          node tools/test-accounts.js
          TEST_DATABASE_URL=postgresql://postgres:test@localhost:5432/airwave_test node tools/test-accounts.js
      - name: Start a server
        run: |
          node server/server.js --port 8080 > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8080/healthz && break; sleep 1; done
      - name: Network and pilot client tests
        run: |
          node tools/test-client.js
          node tools/test-pilot.js
      - name: Server log
        if: always()
        run: cat server.log
