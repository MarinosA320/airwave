# Publishes the ATC scope to GitHub Pages (https://<user>.github.io/<repo>/).
# Set the repository variable AIRWAVE_SERVER_URL (Settings > Secrets and variables > Actions > Variables)
# to your online server, e.g. wss://airwave.onrender.com/ws, so the page connects there by default.
name: Scope on GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the scope page
        env:
          AIRWAVE_DEFAULT_SERVER: ${{ vars.AIRWAVE_SERVER_URL }}
        run: node tools/build-demo.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site
      - id: deployment
        uses: actions/deploy-pages@v4
