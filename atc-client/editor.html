<title>Airwave Sector Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: map canvas on the left, editing panel with tabs on the right. Same dark radar look as the scope. */
:root {
  --bg: #0b1215; --panel: #11191d; --panel-2: #172227; --line: #24333a; --map: #34525d; --map-dim: #1d2d33;
  --fix: #6f909a; --text: #d6e2e5; --muted: #7d939a; --mine: #7fd4f0; --amber: #f0bf4f; --alert: #ff6a5a; --ok: #72d39d;
  --land: #121d1f; --coast: #3c5a5a; --star: #6fae8c; --sid: #c79a4a; --app: #7fb7d4;
  --f-ui: 'Barlow Semi Condensed', 'Arial Narrow', system-ui, sans-serif;
  --f-data: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--f-ui); font-size: 15px; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 1px; }
.app { display: grid; grid-template-columns: minmax(0, 1fr) 400px; grid-template-rows: auto minmax(0, 1fr); height: 100%; }
header { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--line); }
header h1 { margin: 0; font-size: 20px; letter-spacing: .14em; text-transform: uppercase; }
header h1 span { color: var(--mine); }
header h1 small { font-size: 12px; color: var(--muted); letter-spacing: .1em; margin-left: 6px; }
.grow { flex: 1; }
.state { font-family: var(--f-data); font-size: 12.5px; color: var(--muted); }
.state b { color: var(--amber); font-weight: 500; }
.field-inline { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.field-inline input { background: var(--panel-2); border: 1px solid var(--line); padding: 5px 8px; font-family: var(--f-data); font-size: 13px; width: 120px; }
.btn { background: var(--panel-2); border: 1px solid var(--line); padding: 6px 12px; cursor: pointer; font-weight: 600; letter-spacing: .04em; white-space: nowrap; }
.btn:hover { border-color: var(--map); }
.btn[disabled] { opacity: .45; cursor: default; }
.btn.primary { background: var(--mine); color: #062029; border-color: var(--mine); }
.btn.danger { color: var(--alert); border-color: color-mix(in srgb, var(--alert) 50%, var(--line)); }
.btn.on { border-color: var(--amber); color: var(--amber); }
.map { position: relative; min-width: 0; overflow: hidden; }
.map canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.hint-bar { position: absolute; left: 12px; right: 12px; bottom: 12px; padding: 8px 12px; background: color-mix(in srgb, var(--panel) 92%, transparent); border: 1px solid var(--line); font-size: 13.5px; color: var(--muted); pointer-events: none; }
.hint-bar b { color: var(--amber); font-weight: 600; }
.coords { position: absolute; top: 10px; left: 12px; font-family: var(--f-data); font-size: 12px; color: var(--muted); background: color-mix(in srgb, var(--bg) 80%, transparent); padding: 2px 6px; border: 1px solid var(--line); pointer-events: none; }
.zoom { position: absolute; top: 10px; right: 12px; display: flex; flex-direction: column; gap: 4px; }
.zoom button { width: 32px; height: 32px; background: var(--panel-2); border: 1px solid var(--line); cursor: pointer; font-family: var(--f-data); }
.osm-credit { position: absolute; right: 12px; bottom: 56px; font-size: 11px; color: var(--muted); background: color-mix(in srgb, var(--bg) 80%, transparent); padding: 1px 5px; }
.osm-credit a { color: var(--muted); }
aside { display: flex; flex-direction: column; min-height: 0; background: var(--panel); border-left: 1px solid var(--line); }
.tabs { display: flex; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
.tabs button { flex: 1 1 auto; background: none; border: 0; border-bottom: 2px solid transparent; padding: 9px 8px; cursor: pointer; color: var(--muted); font-weight: 600; letter-spacing: .05em; }
.tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--mine); }
.pane { flex: 1; min-height: 0; overflow-y: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 12px; }
.pane > * { flex-shrink: 0; }
h2 { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.list { display: grid; gap: 2px; max-height: 240px; overflow-y: auto; border: 1px solid var(--line); background: var(--bg); }
.list button { display: flex; justify-content: space-between; gap: 8px; background: none; border: 0; border-left: 3px solid transparent; padding: 5px 8px; cursor: pointer; text-align: left; font-family: var(--f-data); font-size: 12.5px; }
.list button:hover { background: var(--panel-2); }
.list button.sel { border-left-color: var(--amber); background: var(--panel-2); color: var(--amber); }
.list button small { color: var(--muted); font-family: var(--f-ui); font-size: 12px; }
.form { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 6px 8px; align-items: center; }
.form label { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.form input, .form select, .search { background: var(--panel-2); border: 1px solid var(--line); padding: 6px 8px; font-family: var(--f-data); font-size: 13px; min-width: 0; width: 100%; }
.form .wide { grid-column: 1 / -1; }
.row { display: flex; flex-wrap: wrap; gap: 6px; }
.checks { display: flex; flex-wrap: wrap; gap: 4px 12px; font-family: var(--f-data); font-size: 12.5px; }
.checks label { display: flex; gap: 5px; align-items: center; cursor: pointer; text-transform: none; letter-spacing: 0; color: var(--text); font-size: 12.5px; }
.checks input { accent-color: var(--mine); }
.legs { width: 100%; border-collapse: collapse; table-layout: fixed; font-family: var(--f-data); font-size: 12px; }
.legs th { text-align: left; font-family: var(--f-ui); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 3px 4px; border-bottom: 1px solid var(--line); }
.legs td { padding: 2px 3px; border-bottom: 1px solid var(--line); }
.legs input, .legs select { width: 100%; min-width: 0; background: var(--panel-2); border: 1px solid var(--line); padding: 3px 4px; font-family: var(--f-data); font-size: 12px; }
.legs .x { background: none; border: 0; color: var(--muted); cursor: pointer; padding: 2px 4px; }
.legs .x:hover { color: var(--text); }
.legs tr.sel td { background: var(--panel-2); }
.note { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.45; }
.note.err { color: var(--alert); }
.note.ok { color: var(--ok); }
.toast { position: fixed; left: 50%; top: 60px; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--line); padding: 10px 16px; font-size: 14px; max-width: min(560px, 90vw); z-index: 5; }
.toast.err { border-color: var(--alert); }
.toast.ok { border-color: var(--ok); }
details summary { cursor: pointer; color: var(--muted); font-size: 13px; }
@media (max-width: 860px) {
  body { overflow: auto; }
  .app { grid-template-columns: 1fr; grid-template-rows: auto 58vh auto; height: auto; }
  aside { border-left: 0; border-top: 1px solid var(--line); }
  .pane { overflow: visible; }
}
</style>

<div class="app">
  <header>
    <h1>Air<span>wave</span><small>Sector editor</small></h1>
    <span class="state" id="state">Loading…</span>
    <span class="grow"></span>
    <label class="field-inline">Your name<input id="by" maxlength="30" placeholder="e.g. Marinos" autocomplete="nickname"></label>
    <label class="field-inline" id="pwWrap">Editor password<input id="pw" type="password" autocomplete="current-password"></label>
    <button class="btn" id="undo" disabled title="Undo (Ctrl+Z)">Undo</button>
    <button class="btn primary" id="save" disabled>Save</button>
    <a class="btn" href="/" style="text-decoration:none">Scope</a>
  </header>

  <div class="map" id="mapBox">
    <canvas id="cv" aria-label="Map"></canvas>
    <div class="coords" id="coords">—</div>
    <div class="zoom">
      <button id="zin" aria-label="Zoom in">+</button>
      <button id="zout" aria-label="Zoom out">&minus;</button>
      <button id="zhome" aria-label="Show whole map">&#9678;</button>
    </div>
    <div class="osm-credit" id="osmCredit" hidden>Background © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap contributors</a></div>
    <div class="hint-bar" id="hint">Pick a tab on the right to start editing. Drag to pan, scroll to zoom.</div>
  </div>

  <aside>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="sectors" aria-selected="true">Sectors</button>
      <button role="tab" data-tab="positions">Positions</button>
      <button role="tab" data-tab="fixes">Waypoints</button>
      <button role="tab" data-tab="airways">Airways</button>
      <button role="tab" data-tab="procs">Procedures</button>
      <button role="tab" data-tab="ground">Ground</button>
    </nav>
    <div class="pane" id="pane"></div>
  </aside>
</div>
<div class="toast" id="toast" hidden></div>

<script src="/shared/airwave-core.js"></script>
<script>
(function () {
  'use strict';
  const A = window.Airwave, G = A.geo;
  const CFG = window.AIRWAVE_EDITOR || { needsPassword: true, github: false };
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const C = {}; ['--bg', '--map', '--map-dim', '--fix', '--text', '--muted', '--mine', '--amber', '--alert', '--ok', '--land', '--coast', '--star', '--sid', '--app', '--line'].forEach(k => C[k.slice(2)] = css(k));
  const store = { get(k, d) { try { const v = localStorage.getItem('airwave.editor.' + k); return v == null ? d : v; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem('airwave.editor.' + k, v); } catch (e) { /* storage off */ } } };
  const clone = o => JSON.parse(JSON.stringify(o));
  const round6 = v => Math.round(v * 1e6) / 1e6;

  // ------------------------------------------------------------ state
  const st = {
    base: null, overlay: null, doc: null, touched: new Set(), undo: [],
    tab: 'sectors', tool: null, draft: null, sel: null, airport: store.get('airport', 'LGAV'),
    layouts: new Map(), view: { lat: 38.3, lon: 24, scale: 2 }, osm: false
  };
  if (!CFG.needsPassword) $('pwWrap').hidden = true;
  $('by').value = store.get('by', '');
  $('by').addEventListener('change', () => store.set('by', $('by').value.trim()));

  async function getJson(url) { const r = await fetch(url); if (!r.ok) throw new Error(url + ' ' + r.status); return r.json(); }
  async function load() {
    const [base, map, overlay] = await Promise.all([getJson('/base-map.json'), getJson('/map.json'), getJson('/overlay.json')]);
    st.base = base; st.overlay = overlay;
    st.doc = {
      sectors: clone(map.sectors), facilities: clone(map.facilities),
      fixes: new Map(map.fixes.map(f => [f.id, clone(f)])), airways: clone(map.airways || []),
      coast: map.coast || [], magvar: map.magvar, transitionAlt: map.transitionAlt || 6000,
      airports: map.airports.map(a => clone(a))
    };
    st.touched.clear(); st.undo = []; st.layouts.clear();
    homeView(); updateState(); renderPane();
  }
  const airportOf = icao => st.doc.airports.find(a => a.icao === icao);
  function fixById(id, ap) {
    const f = st.doc.fixes.get(id); if (f) return f;
    const a = ap || airportOf(st.airport);
    const w = a && (a.waypoints || []).find(x => x.id === id); if (w) return w;
    for (const o of st.doc.airports) { const w2 = (o.waypoints || []).find(x => x.id === id); if (w2) return w2; }
    return null;
  }

  // ------------------------------------------------------------ undo + dirty tracking
  // Every change goes through edit(), which snapshots the parts that can change and marks them as touched.
  function snapshot() {
    return { sectors: clone(st.doc.sectors), facilities: clone(st.doc.facilities), fixes: clone([...st.doc.fixes.values()]), airways: clone(st.doc.airways),
      airports: clone(st.doc.airports.filter(a => st.touched.has('ap:' + a.icao) || a.icao === st.airport).map(a => ({ icao: a.icao, procedures: a.procedures, waypoints: a.waypoints, layout: a.layout, runwayConfig: a.runwayConfig }))),
      touched: [...st.touched] };
  }
  function restore(s) {
    st.doc.sectors = s.sectors; st.doc.facilities = s.facilities; st.doc.fixes = new Map(s.fixes.map(f => [f.id, f])); st.doc.airways = s.airways;
    for (const a of s.airports) Object.assign(airportOf(a.icao), { procedures: a.procedures, waypoints: a.waypoints, layout: a.layout, runwayConfig: a.runwayConfig });
    st.touched = new Set(s.touched);
  }
  function edit(category, fn) {
    st.undo.push(snapshot()); if (st.undo.length > 60) st.undo.shift();
    fn(); st.touched.add(category); updateState();
  }
  $('undo').onclick = () => { const s = st.undo.pop(); if (!s) return; restore(s); st.draft = null; updateState(); renderPane(); };
  function updateState() {
    const n = st.touched.size;
    $('state').innerHTML = 'Map edit <b>' + (st.overlay ? st.overlay.rev || 0 : 0) + '</b>' + (n ? ' · <b>' + n + ' unsaved change' + (n > 1 ? 's' : '') + '</b>' : ' · no unsaved changes') + (CFG.github ? ' · saves to GitHub' : ' · not saved to GitHub');
    $('save').disabled = !n; $('undo').disabled = !st.undo.length;
  }
  window.addEventListener('beforeunload', e => { if (st.touched.size) { e.preventDefault(); e.returnValue = ''; } });

  // ------------------------------------------------------------ saving
  function buildOverlay() {
    const ov = clone(st.overlay && st.overlay.rev ? st.overlay : {});
    delete ov.rev; delete ov.updated; delete ov.by;
    ov.version = 1;
    if (st.touched.has('sectors')) ov.sectors = st.doc.sectors;
    if (st.touched.has('facilities')) ov.facilities = st.doc.facilities;
    if (st.touched.has('airways')) ov.airways = st.doc.airways;
    if (st.touched.has('fixes')) {
      const baseFix = new Map(st.base.fixes.map(f => [f.id, f]));
      const upsert = [], remove = [];
      for (const f of st.doc.fixes.values()) { const b = baseFix.get(f.id); if (!b || b.lat !== f.lat || b.lon !== f.lon || b.kind !== f.kind || b.name !== f.name) upsert.push(f); }
      for (const id of baseFix.keys()) if (!st.doc.fixes.has(id)) remove.push(id);
      ov.fixes = { upsert, remove };
    }
    for (const t of st.touched) {
      if (!t.startsWith('ap:')) continue;
      const a = airportOf(t.slice(3)); ov.airports = ov.airports || {};
      const o = ov.airports[a.icao] = ov.airports[a.icao] || {};
      for (const k of ['procedures', 'waypoints', 'layout', 'runwayConfig']) if (a[k]) o[k] = a[k];
    }
    return ov;
  }
  $('save').onclick = async () => {
    const by = $('by').value.trim();
    if (!by) { toast('Enter your name first, so the change history shows who edited.', 'err'); $('by').focus(); return; }
    $('save').disabled = true; $('save').textContent = 'Saving…';
    try {
      const res = await fetch('/editor/save', { method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ password: $('pw').value, by, baseRev: st.overlay ? st.overlay.rev || 0 : 0, overlay: buildOverlay() }) });
      const r = await res.json();
      if (!res.ok) { toast(r.error || 'Saving failed.', 'err'); return; }
      toast('Saved as map edit ' + r.rev + '. ' + (r.github && r.github.saved ? 'Committed to GitHub.' : (r.github && r.github.why) || ''), r.github && r.github.saved ? 'ok' : 'err');
      st.overlay = await getJson('/overlay.json'); st.touched.clear(); st.undo = [];
    } catch (e) { toast('Could not reach the server: ' + e.message, 'err'); }
    finally { $('save').textContent = 'Save'; updateState(); }
  };
  let toastTimer;
  function toast(text, kind) { const t = $('toast'); t.textContent = text; t.className = 'toast ' + (kind || ''); t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 6000); }

  // ------------------------------------------------------------ map view
  const cv = $('cv'), ctx = cv.getContext('2d');
  let W = 0, H = 0, DPR = 1;
  function resize() { const r = $('mapBox').getBoundingClientRect(); DPR = window.devicePixelRatio || 1; W = r.width; H = r.height; cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR); }
  new ResizeObserver(resize).observe($('mapBox'));
  const P = p => { const o = G.offsetNm(st.view, p); return [W / 2 + o.x * st.view.scale, H / 2 - o.y * st.view.scale]; };
  const PL = q => P({ lat: q[0], lon: q[1] });
  const unP = (x, y) => ({ lat: st.view.lat + (H / 2 - y) / st.view.scale / 60, lon: st.view.lon + (x - W / 2) / st.view.scale / (60 * Math.cos(st.view.lat * Math.PI / 180)) });
  const font = (px, w) => (w || 400) + ' ' + px + 'px "IBM Plex Mono", ui-monospace, monospace';
  function homeView() {
    const pts = st.doc.sectors.flatMap(s => s.polygon); if (!pts.length || !W) return;
    const la = pts.map(p => p[0]), lo = pts.map(p => p[1]);
    st.view.lat = (Math.min(...la) + Math.max(...la)) / 2; st.view.lon = (Math.min(...lo) + Math.max(...lo)) / 2;
    st.view.scale = Math.min((W - 40) / ((Math.max(...lo) - Math.min(...lo)) * 60 * Math.cos(st.view.lat * Math.PI / 180)), (H - 80) / ((Math.max(...la) - Math.min(...la)) * 60));
  }
  function zoomTo(p, scale) { st.view.lat = p.lat; st.view.lon = p.lon; st.view.scale = scale; }
  const clampScale = s => Math.max(0.5, Math.min(8000, s));
  function zoomAt(f, x, y) { const b = unP(x, y); st.view.scale = clampScale(st.view.scale * f); const a = unP(x, y); st.view.lat += b.lat - a.lat; st.view.lon += b.lon - a.lon; }
  $('zin').onclick = () => zoomAt(1.4, W / 2, H / 2); $('zout').onclick = () => zoomAt(1 / 1.4, W / 2, H / 2); $('zhome').onclick = homeView;

  // OpenStreetMap background for tracing ground layouts (optional; tiles load in your browser)
  const tiles = new Map();
  function osmTile(z, x, y) {
    const k = z + '/' + x + '/' + y; let t = tiles.get(k); if (t) return t;
    t = new Image(); t.src = 'https://tile.openstreetmap.org/' + k + '.png'; tiles.set(k, t);
    if (tiles.size > 300) tiles.delete(tiles.keys().next().value);
    return t;
  }
  function drawOsm() {
    const z = Math.max(3, Math.min(19, Math.round(Math.log2(360 * 60 * Math.cos(st.view.lat * Math.PI / 180) * st.view.scale / 256))));
    const n = 2 ** z, lx = lon => (lon + 180) / 360 * n, ly = lat => (1 - Math.log(Math.tan(lat * Math.PI / 180) + 1 / Math.cos(lat * Math.PI / 180)) / Math.PI) / 2 * n;
    const xl = x => x / n * 360 - 180, yl = y => Math.atan(Math.sinh(Math.PI * (1 - 2 * y / n))) * 180 / Math.PI;
    const nw = unP(0, 0), se = unP(W, H);
    const x0 = Math.floor(lx(nw.lon)), x1 = Math.floor(lx(se.lon)), y0 = Math.floor(ly(nw.lat)), y1 = Math.floor(ly(se.lat));
    if ((x1 - x0 + 1) * (y1 - y0 + 1) > 48) return;
    ctx.save(); ctx.globalAlpha = 0.55; ctx.filter = 'invert(1) hue-rotate(180deg) saturate(0.4) brightness(0.8)';
    for (let x = x0; x <= x1; x++) for (let y = y0; y <= y1; y++) {
      const img = osmTile(z, x, y); if (!img.complete || !img.naturalWidth) continue;
      const [ax, ay] = P({ lat: yl(y), lon: xl(x) }), [bx, by] = P({ lat: yl(y + 1), lon: xl(x + 1) });
      ctx.drawImage(img, ax, ay, bx - ax + 0.5, by - ay + 0.5);
    }
    ctx.restore();
  }

  // ------------------------------------------------------------ drawing
  const SECTOR_COLORS = ['#7fd4f0', '#c79ae0', '#6fae8c', '#e0a86f', '#d07f9b', '#9fb86a', '#6f8fe0', '#e0d06f'];
  function path(points, close) { ctx.beginPath(); points.forEach((q, i) => { const [x, y] = Array.isArray(q) ? PL(q) : P(q); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }); if (close) ctx.closePath(); }
  function draw() {
    requestAnimationFrame(draw);
    if (!st.doc || !W) return;
    const sc = st.view.scale, d = st.doc;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
    if (st.osm) drawOsm();
    // coast
    ctx.beginPath(); for (const ring of d.coast) ring.forEach((q, i) => { const [x, y] = PL(q); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
    if (!st.osm) { ctx.fillStyle = C.land; ctx.fill('evenodd'); } ctx.strokeStyle = C.coast; ctx.lineWidth = 1; ctx.stroke();
    // sectors
    d.sectors.forEach((z, i) => {
      const sel = st.sel && st.sel.kind === 'sector' && st.sel.i === i;
      const col = SECTOR_COLORS[i % SECTOR_COLORS.length];
      path(z.polygon, true);
      ctx.fillStyle = col; ctx.globalAlpha = sel ? 0.14 : (st.tab === 'sectors' || st.tab === 'positions' ? 0.05 : 0); ctx.fill(); ctx.globalAlpha = 1;
      ctx.strokeStyle = sel ? C.amber : (st.tab === 'sectors' ? col : C.map); ctx.lineWidth = sel ? 2 : 1.2; ctx.stroke();
      const c = z.polygon.reduce((s, q) => [s[0] + q[0] / z.polygon.length, s[1] + q[1] / z.polygon.length], [0, 0]);
      const [cx, cy] = PL(c); ctx.fillStyle = sel ? C.amber : C.muted; ctx.font = '700 ' + Math.max(12, Math.min(22, sc * 3)) + 'px "Barlow Semi Condensed", sans-serif'; ctx.textAlign = 'center';

    pane.querySelectorAll('[data-rc]').forEach(c => c.onchange = () => {
      const ap = airportOf(st.airport);
      edit('ap:' + ap.icao, () => { const pick = k => [...pane.querySelectorAll('[data-rc=' + k + ']:checked')].map(i => i.value); ap.runwayConfig = { arr: pick('arr'), dep: pick('dep') }; });
    });
    // procedure leg table
    pane.querySelectorAll('.legs tr[data-leg]').forEach(tr => {
      const k = +tr.dataset.leg;
      tr.querySelectorAll('[data-f]').forEach(inp => inp.onchange = () => {
        const ap = airportOf(st.airport), pr = ap.procedures[st.sel.i], leg = procSeg(pr, st.sel.seg)[k];
        edit('ap:' + ap.icao, () => {
          const f = inp.dataset.f;
          if (f === 'fix') { const v = inp.value.trim().toUpperCase(); if (!fixById(v, ap)) toast(v + ' is not on the map yet. Add it with "New waypoint here".', 'err'); leg.fix = v; }
          if (f === 'alt') { const v = parseInt(inp.value, 10); if (v) leg.alt = v; else { delete leg.alt; delete leg.altType; } }
          if (f === 'altType') { if (inp.value === 'at') delete leg.altType; else leg.altType = inp.value; }
          if (f === 'spd') { const v = parseInt(inp.value, 10); if (v) leg.spd = v; else delete leg.spd; }
          if (f === 'faf') { procSeg(pr, 'legs').forEach(l => delete l.faf); if (inp.checked) leg.faf = true; }
        });
        renderPane();
      });
    });
    pane.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { const ap = airportOf(st.airport), legs = procSeg(ap.procedures[st.sel.i], st.sel.seg); edit('ap:' + ap.icao, () => legs.splice(+b.dataset.del, 1)); renderPane(); });
    pane.querySelectorAll('[data-up]').forEach(b => b.onclick = () => { const k = +b.dataset.up; if (!k) return; const ap = airportOf(st.airport), legs = procSeg(ap.procedures[st.sel.i], st.sel.seg); edit('ap:' + ap.icao, () => legs.splice(k - 1, 0, legs.splice(k, 1)[0])); renderPane(); });
    pane.querySelectorAll('[data-a]').forEach(b => b.onclick = () => action(b.dataset.a));
  }
  const val = id => ($(id) ? $(id).value.trim() : '');
  const askName = (label, fallback) => {
    // The page cannot use prompt(), so names come from a small inline form in the panel.
    return new Promise(resolve => {
      const box = document.createElement('div'); box.className = 'form';
      box.innerHTML = '<label for="askIn">' + esc(label) + '</label><input id="askIn" value="' + esc(fallback || '') + '" maxlength="24"><span></span><div class="row"><button class="btn primary" id="askOk">Continue</button><button class="btn" id="askNo">Cancel</button></div>';
      $('pane').prepend(box); $('askIn').focus(); $('askIn').select();
      const done = v => { box.remove(); resolve(v); };
      $('askOk').onclick = () => done($('askIn').value.trim().toUpperCase() || null);
      $('askNo').onclick = () => done(null);
      $('askIn').onkeydown = e => { if (e.key === 'Enter') $('askOk').click(); if (e.key === 'Escape') $('askNo').click(); };
    });
  };
  async function action(a) {
    const ap = airportOf(st.airport);
    switch (a) {
      case 'finish': return finishDraft();
      case 'cancel': st.draft = null; return renderPane();
      case 'delete': return deleteSelected();
      case 'newSector': { const id = await askName('New sector ID', 'NEW' + (st.doc.sectors.length + 1)); if (!id) return; return startDraft({ type: 'sector', id, name: id, snap: 'sector', closed: true }); }
      case 'applySector': {
        const s = st.doc.sectors[st.sel.i], oldId = s.id, id = val('sId').toUpperCase();
        if (!id) return toast('The sector needs an ID.', 'err');
        edit('sectors', () => { Object.assign(s, { id, name: val('sName') || id, floor: val('sFloor') === '' ? null : +val('sFloor'), ceiling: val('sCeil') === '' ? null : +val('sCeil') }); });
        if (oldId !== id) edit('facilities', () => st.doc.facilities.forEach(f => { if (f.covers) f.covers = f.covers.map(c => (c === oldId ? id : c)); }));
        return renderPane();
      }
      case 'newCtr': case 'newApPos': {
        const id = await askName('Callsign', a === 'newCtr' ? 'LGGG_X_CTR' : st.airport + '_TWR'); if (!id) return;
        if (st.doc.facilities.some(f => f.id === id)) return toast(id + ' already exists.', 'err');
        const f = a === 'newCtr' ? { id, name: id, freq: '135.000', kind: 'CTR', rank: 4, covers: [] }
          : { id, name: (ap.city || ap.icao) + ' Tower', freq: '118.000', kind: 'TWR', rank: 1, airport: ap.icao, area: { lat: ap.lat, lon: ap.lon, radius: 10, ceiling: ap.elev + 4000 } };
        edit('facilities', () => st.doc.facilities.push(f)); st.sel = { kind: 'facility', i: st.doc.facilities.length - 1 }; return renderPane();
      }
      case 'applyFac': {
        const f = st.doc.facilities[st.sel.i];
        const id = val('fId').toUpperCase(), freq = val('fFreq');
        if (!/^[A-Z0-9_]{2,12}$/.test(id)) return toast('Callsigns use letters, digits and _ (like LGGG_W_CTR).', 'err');
        if (!/^1[1-3]\d\.\d{3}$/.test(freq)) return toast('Frequencies look like 132.225.', 'err');
        edit('facilities', () => {
          Object.assign(f, { id, name: val('fName') || id, freq, kind: val('fKind') });
          f.rank = f.kind === 'CTR' ? 4 : { DEL: 0, GND: 0, TWR: 1, F_APP: 2, DEP: 2, APP: 3 }[f.kind];
          if (f.kind === 'CTR') { f.covers = [...$('pane').querySelectorAll('[data-cover]:checked')].map(c => c.dataset.cover); delete f.area; }
          else { f.area = Object.assign(f.area || { lat: ap.lat, lon: ap.lon }, { radius: +val('fRad') || 10, ceiling: +val('fCeil') || 4000 }); delete f.covers; }
        });
        return renderPane();
      }
      case 'deleteFac': edit('facilities', () => st.doc.facilities.splice(st.sel.i, 1)); st.sel = null; return renderPane();
      case 'newFix': { const id = await askName('Waypoint name', ''); if (!id) return; if (!/^[A-Z0-9]{2,7}$/.test(id)) return toast('Use 2 to 7 letters or digits.', 'err'); return startDraft({ type: 'fix', id, single: true }); }
      case 'applyFix': {
        const f = st.doc.fixes.get(st.sel.id), id = val('xId').toUpperCase(), lat = parseFloat(val('xLat')), lon = parseFloat(val('xLon'));
        if (!/^[A-Z0-9]{2,7}$/.test(id) || !(Math.abs(lat) <= 90) || !(Math.abs(lon) <= 180)) return toast('Check the name and position.', 'err');
        if (id !== f.id && st.doc.fixes.has(id)) return toast(id + ' already exists.', 'err');
        edit('fixes', () => { st.doc.fixes.delete(f.id); Object.assign(f, { id, kind: val('xKind'), lat, lon }); st.doc.fixes.set(id, f); });
        if (id !== st.sel.id) { const old = st.sel.id; edit('airways', () => st.doc.airways.forEach(w => { if (w[0] === old) w[0] = id; if (w[1] === old) w[1] = id; })); }
        st.sel = { kind: 'fix', id }; return renderPane();
      }
      case 'newAirway': { const name = await askName('Airway name', 'UL999'); if (!name) return; return startDraft({ type: 'airway', name, snap: 'fix' }); }
      case 'renameAwy': { const n = val('aName').toUpperCase(); if (!n) return; const old = st.sel.name; edit('airways', () => st.doc.airways.forEach(w => { if (w[2] === old) w[2] = n; })); st.sel = { kind: 'airway', name: n }; return renderPane(); }
      case 'trimAwy': { const n = st.sel.name; const idx = st.doc.airways.map((w, i) => (w[2] === n ? i : -1)).filter(i => i >= 0).pop(); if (idx != null) edit('airways', () => st.doc.airways.splice(idx, 1)); return renderPane(); }
      case 'newProc': {
        const name = await askName('Procedure name, e.g. KEA2A or RNP Z RWY 03R', ''); if (!name) return;
        const type = /RWY|ILS|RNP|LOC|VOR|NDB/.test(name) ? 'APP' : (st.procFilter || 'STAR');
        const pr = { type, name, runway: A.runwaysInUse(ap, type === 'SID' ? 'dep' : 'arr')[0].id, legs: [] };
        if (type === 'APP') { pr.approach = name.split(' ')[0]; pr.transitions = {}; }
        edit('ap:' + ap.icao, () => { ap.procedures = ap.procedures || []; ap.procedures.push(pr); });
        st.sel = { kind: 'proc', i: ap.procedures.length - 1, seg: 'legs' }; toast('New ' + type + '. Change the type with the filter if needed, then click waypoints to add legs.'); return renderPane();
      }
      case 'applyProc': {
        const pr = ap.procedures[st.sel.i];
        edit('ap:' + ap.icao, () => { pr.name = val('pName').toUpperCase() || pr.name; pr.runway = val('pRwy'); if ($('pKind')) pr.approach = val('pKind'); });
        return renderPane();
      }
      case 'newTransition': { const from = await askName('Transition starts at (fix)', ''); if (!from) return; const pr = ap.procedures[st.sel.i]; edit('ap:' + ap.icao, () => { pr.transitions = pr.transitions || {}; pr.transitions[from] = [{ fix: from }]; }); st.sel.seg = 'tr:' + from; return renderPane(); }
      case 'delTransition': { const pr = ap.procedures[st.sel.i], k = st.sel.seg.slice(3); edit('ap:' + ap.icao, () => delete pr.transitions[k]); st.sel.seg = 'legs'; return renderPane(); }
      case 'procWpt': { const id = await askName('New waypoint name', ''); if (!id) return; return startDraft({ type: 'procWpt', id, single: true }); }
      case 'zoomAp': zoomTo(ap, 300); return;
      case 'gTaxiway': case 'gStand': case 'gGate': case 'gHolding': case 'gApron': {
        if (!ap.layout && !st.layouts.has(ap.icao)) return toast('Still loading the layout, try again in a moment.', 'err');
        const ref = (val('gRef') || '').toUpperCase();
        const type = a.slice(1).toLowerCase();
        if (type !== 'apron' && !ref) return toast('Type the ' + (type === 'taxiway' ? 'taxiway name (like B2)' : type + ' number') + ' first.', 'err');
        if (st.view.scale < 100) zoomTo(ap, 300);
        return startDraft({ type, ref, single: ['stand', 'gate', 'holding'].includes(type), closed: type === 'apron' });
      }
      case 'applyGround': {
        const L = editableLayout(ap), s = st.sel;
        edit('ap:' + ap.icao, () => { ({ taxiway: L.taxiways, stand: L.stands, gate: L.gates, holding: L.holding, apron: L.aprons })[s.kind][s.i].ref = val('gSelRef').toUpperCase(); });
        return renderPane();
      }
    }
  }
  function appendLeg(id) {
    const ap = airportOf(st.airport), pr = ap.procedures[st.sel.i], legs = procSeg(pr, st.sel.seg);
    if (legs.length && legs[legs.length - 1].fix === id) return;
    edit('ap:' + ap.icao, () => legs.push({ fix: id })); renderPane();
  }

  // ------------------------------------------------------------ start
  resize();
  load().then(() => { homeView(); requestAnimationFrame(draw); }).catch(e => { $('state').textContent = 'Could not load the map: ' + e.message; });
})();
</script>
